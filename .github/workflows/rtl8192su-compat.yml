name: RTL8191SU driver compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/rtl8192su-compat.yml'
      - 'image/drivers/rtl8192su/**'
      - 'docs/wifi-support.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-driver:
    name: Build module against Alpine CM5 kernel headers
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DRIVER_REVISION: 1f09c7a6eceffc92e63ddc636c174e8f3770eeb9
      KERNEL_RELEASE: 6.18.58-0-rpi
      KERNEL_PACKAGE_VERSION: 6.18.58-r0
    steps:
      - name: Check out TravelRouter compatibility patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build r92su against Alpine's exact Raspberry Pi kernel headers
        run: |
          docker run --rm --platform linux/arm64 \
            -e DRIVER_REVISION -e KERNEL_RELEASE -e KERNEL_PACKAGE_VERSION \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a \
            sh -eu -c '
              apk add --no-cache build-base git kmod patch
              kernel_dev="linux-rpi-dev-${KERNEL_PACKAGE_VERSION}.apk"
              wget -q -O "/tmp/${kernel_dev}" \
                "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/aarch64/${kernel_dev}"
              apk verify "/tmp/${kernel_dev}"
              apk add --no-cache "/tmp/${kernel_dev}"
              kernel_dir="/usr/src/linux-headers-${KERNEL_RELEASE}"
              test -d "$kernel_dir" || { echo "Missing expected kernel headers: $kernel_dir"; ls -la /usr/src; exit 1; }
              test -s "$kernel_dir/Module.symvers" || { echo "Missing Module.symvers in $kernel_dir"; ls -la "$kernel_dir"; exit 1; }
              mkdir -p build
              git clone --filter=blob:none https://github.com/chunkeey/rtl8192su.git build/rtl8192su
              git -C build/rtl8192su checkout --detach "$DRIVER_REVISION"
              test "$(git -C build/rtl8192su rev-parse HEAD)" = "$DRIVER_REVISION"
              for patch_file in image/drivers/rtl8192su/*.patch; do
                patch --directory=build/rtl8192su/r92su -p1 < "$patch_file"
              done
              make -C "$kernel_dir" \
                M="$PWD/build/rtl8192su/r92su" ARCH=arm64 CONFIG_R92SU=m modules
              module=build/rtl8192su/r92su/r92su.ko
              test -s "$module"
              vermagic=$(modinfo -F vermagic "$module")
              case "$vermagic" in "$KERNEL_RELEASE "*) ;; *) echo "Unexpected vermagic: $vermagic"; exit 1 ;; esac
              modinfo -F alias "$module" | grep -F 'usb:v0BDAp8172'
              test "$(modinfo -F firmware "$module")" = rtlwifi/rtl8712u.bin
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rtl8191su-r92su-aarch64
          path: build/rtl8192su/r92su/r92su.ko
          if-no-files-found: error
          retention-days: 14
