name: Quality, security and image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      image_release:
        description: 'Optional existing release tag to boot-test instead of building an image'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: image-matrix-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Lint, tests and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests image site
      - run: bandit -q -r src image site -c pyproject.toml
      - run: python site/build.py && python site/check.py
      - run: shellcheck -s sh image/*.sh image/e2e/*.sh image/targets/*.sh rootfs/etc/init.d/travelrouter rootfs/etc/init.d/travelrouter-bootstrap
      - run: PYTHONPATH=src coverage run --source=src/travelrouter -m unittest discover -s tests -v
      - run: coverage report
      - run: pip-audit -r requirements-dev.txt

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b
        with:
          fail-on-severity: high

  image:
    name: Build and validate offline CM5 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build inside pinned Alpine
        if: inputs.image_release == ''
        run: >-
          docker run --rm --cap-add NET_ADMIN
          -e GITHUB_SHA -e GITHUB_REF_NAME
          -v "$PWD:/source" -w /source
          alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          sh image/build.sh
      - name: Download the published image selected for diagnosis
        if: github.event_name == 'workflow_dispatch' && inputs.image_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RELEASE: ${{ inputs.image_release }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/* ]] || exit 1
          [[ "$IMAGE_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p dist
          gh release download "$IMAGE_RELEASE" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern travelrouter-cm5-aarch64.img.gz --pattern SHA256SUMS
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Boot the built image and exercise a wireless client
        timeout-minutes: 35
        run: >-
          docker run --rm
          -v "$PWD:/source" -w /source
          alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          sh image/e2e/run.sh dist/travelrouter-cm5-aarch64.img.gz
      - name: Preserve image boot and client diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-boot-diagnostics
          path: build/e2e-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Scan installed image packages
        if: inputs.image_release == ''
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          scan-type: rootfs
          scan-ref: build/check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: travelrouter-cm5-aarch64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  generic-image:
    name: Build and boot ${{ matrix.target }}
    if: inputs.image_release == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: generic-x86_64
            runner: ubuntu-24.04
          - target: generic-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build runtime image and installer ISO
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          docker run --rm --cap-add NET_ADMIN
          -e GITHUB_SHA -e GITHUB_REF_NAME
          -v "$PWD:/source" -w /source
          alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          sh image/build-generic.sh "$BUILD_TARGET"
      - name: Boot UEFI installer and validate installed runtime
        timeout-minutes: 35
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: >-
          docker run --rm
          -v "$PWD:/source" -w /source
          alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          sh image/e2e/generic.sh "$BUILD_TARGET"
      - name: Preserve UEFI and installer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-boot-diagnostics-${{ matrix.target }}
          path: build/e2e-results-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Scan installed target packages
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          scan-type: rootfs
          scan-ref: build/${{ matrix.target }}/check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Scan the offline installer environment
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          scan-type: rootfs
          scan-ref: build/${{ matrix.target }}/installer-check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: travelrouter-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish attested experimental release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, secrets, codeql, image, generic-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: travelrouter-*
          path: dist
          merge-multiple: true
      - name: Verify every platform artifact
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          sha256sum -c travelrouter-generic-x86_64-SHA256SUMS
          sha256sum -c travelrouter-generic-aarch64-SHA256SUMS
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==50.0.2
      - name: Sign application update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python image/sign_update.py
      - run: python image/release_manifest.py dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish downloadable image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "$RELEASE_TAG — Experimental router images" --notes-file docs/release-notes.md
