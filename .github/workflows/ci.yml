name: Quality, security and image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Lint, tests and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests image
      - run: bandit -q -r src image -c pyproject.toml
      - run: shellcheck -s sh image/build.sh rootfs/etc/init.d/travelrouter rootfs/etc/init.d/travelrouter-bootstrap
      - run: PYTHONPATH=src coverage run --source=src/travelrouter -m unittest discover -s tests -v
      - run: coverage report
      - run: pip-audit -r requirements-dev.txt

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b
        with:
          fail-on-severity: high

  image:
    name: Build and validate offline CM5 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build inside pinned Alpine
        run: >-
          docker run --rm --cap-add NET_ADMIN
          -e GITHUB_SHA -e GITHUB_REF_NAME
          -v "$PWD:/source" -w /source
          alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          sh image/build.sh
      - name: Scan installed image packages
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          scan-type: rootfs
          scan-ref: build/check
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: travelrouter-cm5-aarch64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish attested experimental release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, secrets, codeql, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: travelrouter-cm5-aarch64
          path: dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish downloadable image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "$RELEASE_TAG — Experimental CM5 image" --notes-file docs/release-notes.md
