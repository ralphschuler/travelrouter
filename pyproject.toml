[project]
name = "travelrouter"
version = "0.3.0"
description = "Offline-first Alpine travel router for CM5 and AMD64/ARM64 UEFI systems"
requires-python = ">=3.12"
dependencies = ["cryptography>=46.0.0"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"image/validate.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B404"]
