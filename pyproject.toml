[project]
name = "travelrouter"
version = "0.1.0"
description = "Offline-first Alpine travel router for Raspberry Pi CM5"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"image/validate.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B404"]
